<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI Engineer Learning OS</title>
  <style>
/* ==========================================================================
   AI Engineer Learning OS - Modern, Engaging, High-Impact Styles
   Vibrant Card Grids, Stage Filter Chips, Interactive Milestones, Dark Aesthetic
   ========================================================================== */

:root {
  --bg: #0c0e14;
  --sf: #151924;
  --sf-card: #131722;
  --sf-hover: #1c2232;
  --bd: #272d3d;
  --bd-hover: #3d465c;
  --bd-focus: #4c8dff;
  --tx: #e8ebf4;
  --tx-dim: #94a3b8;
  --mu: #9aa3b8;

  --ac: #4c8dff;
  --ac-hover: #3373eb;
  --cy: #38d6e8;
  --gr: #64748b;
  --bl: #4c8dff;
  --am: #f5a524;
  --gn: #2fbf71;
  --pu: #a855f7;

  --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace;

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;

  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.6);
  --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

:root[data-theme="light"] {
  --bg: #f4f5fa;
  --sf: #ffffff;
  --sf-card: #ffffff;
  --sf-hover: #f1f4f9;
  --bd: #d8dcea;
  --bd-hover: #cbd5e1;
  --bd-focus: #3b82f6;
  --tx: #161a26;
  --tx-dim: #475569;
  --mu: #64748b;
  --ac: #3b82f6;
  --ac-hover: #2563eb;
  --cy: #07899c;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  margin: 0;
  background-color: var(--bg);
  color: var(--tx);
  font: 14.5px/1.5 var(--font-sans);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* Header Navbar */
header.app-header {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  border-bottom: 1px solid var(--bd);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 50;
}

.brand-title {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--tx);
  letter-spacing: -0.01em;
}

nav.header-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}

.nav-btn {
  background: var(--sf);
  border: 1px solid var(--bd);
  border-radius: var(--radius-md);
  padding: 6px 12px;
  cursor: pointer;
  color: var(--tx);
  font-size: 0.85rem;
  font-weight: 500;
  transition: var(--transition);
}

.nav-btn:hover { border-color: var(--ac); background: var(--sf-hover); }
.nav-btn.active { background: var(--ac); border-color: var(--ac); color: #fff; font-weight: 600; }

.header-right { display: flex; align-items: center; gap: 10px; }
.search-mini {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--sf);
  border: 1px solid var(--bd);
  border-radius: var(--radius-md);
  padding: 4px 10px;
}
.search-mini input { background: transparent; border: none; outline: none; color: var(--tx); font-size: 0.8rem; width: 140px; }
.search-mini kbd { background: var(--bg); border: 1px solid var(--bd); border-radius: 4px; padding: 1px 5px; font-size: 0.68rem; font-family: var(--font-mono); color: var(--mu); }
.user-pill { font-size: 0.82rem; color: var(--mu); }
.btn-theme { background: var(--sf); border: 1px solid var(--bd); border-radius: var(--radius-md); padding: 6px 12px; font-size: 0.82rem; color: var(--tx); cursor: pointer; transition: var(--transition); }
.btn-theme:hover { border-color: var(--ac); }

/* Main Content Area */
main#main-content-area {
  max-width: 1340px;
  margin: 0 auto;
  padding: 24px;
}

.view-panel { display: none; }
.view-panel.active { display: block; animation: fadeIn 0.15s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* Cards & Layout */
.card {
  background: var(--sf);
  border: 1px solid var(--bd);
  border-radius: var(--radius-lg);
  padding: 22px;
  margin-bottom: 20px;
}

/* Dashboard Specific Layout */
.dash-welcome-card {
  background: linear-gradient(135deg, rgba(21, 25, 36, 0.98), rgba(28, 34, 50, 0.95));
  border: 1px solid var(--bd);
  border-radius: var(--radius-xl);
  padding: 26px 28px;
  margin-bottom: 22px;
}

.dash-header-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 18px;
}

.progress-bar-wrap { margin: 16px 0 10px; }
.progress-bar { height: 8px; background: var(--bd); border-radius: 999px; overflow: hidden; }
.progress-bar-fill { display: block; height: 100%; background: linear-gradient(90deg, var(--ac), var(--cy)); border-radius: 999px; transition: width 0.4s ease; }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin: 18px 0 14px;
}

.stat-box {
  background: var(--sf-card);
  border: 1px solid var(--bd);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
}

.stat-box b { font-size: 1.85rem; font-weight: 800; font-family: var(--font-mono); margin-bottom: 2px; }
.stat-box span { font-size: 0.78rem; color: var(--mu); text-transform: uppercase; font-weight: 600; letter-spacing: 0.04em; }

/* Continue Learning Hero Card */
.continue-learning-card {
  background: var(--sf);
  border: 2px solid var(--pu);
  border-radius: var(--radius-xl);
  padding: 26px 28px;
  margin-bottom: 22px;
  box-shadow: 0 4px 24px rgba(168, 85, 247, 0.12);
}

.continue-title { font-size: 1.55rem; font-weight: 800; color: #fff; margin: 10px 0 8px; }
.tag-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.why-box { background: var(--sf-card); border: 1px solid var(--bd); border-left: 3px solid var(--pu); border-radius: var(--radius-md); padding: 14px 16px; margin-top: 14px; font-size: 0.88rem; line-height: 1.55; }

/* Filter Chips */
.filter-chip-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 16px;
}

.filter-chip {
  background: var(--sf);
  border: 1px solid var(--bd);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--mu);
  cursor: pointer;
  white-space: nowrap;
  transition: var(--transition);
}

.filter-chip:hover { border-color: var(--ac); color: var(--tx); }
.filter-chip.active { background: var(--ac); border-color: var(--ac); color: #fff; }

/* Topic Visual Grid Cards (Modern & Addictive) */
.topics-visual-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 16px;
}

.topic-visual-card {
  background: var(--sf);
  border: 1px solid var(--bd);
  border-radius: var(--radius-lg);
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: var(--transition);
  cursor: pointer;
}

.topic-visual-card:hover {
  transform: translateY(-2px);
  border-color: var(--ac);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
}

.topic-visual-card.recommended-card {
  border-color: var(--pu);
  background: linear-gradient(135deg, rgba(21, 25, 36, 0.95), rgba(28, 24, 45, 0.95));
}

/* Stage Stepper Banner */
.stage-stepper {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 0;
  margin-bottom: 20px;
}

.stage-step-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--sf);
  border: 1px solid var(--bd);
  border-radius: var(--radius-md);
  padding: 8px 14px;
  white-space: nowrap;
  cursor: pointer;
  transition: var(--transition);
}

.stage-step-pill:hover { border-color: var(--ac); }
.stage-step-pill.current-step {
  border-color: var(--ac);
  background: rgba(76, 141, 255, 0.12);
}

/* Roadmap Horizontal Scroll Canvas */
.roadwrap {
  overflow-x: auto;
  overflow-y: hidden;
  border: 1px solid var(--bd);
  border-radius: var(--radius-lg);
  background: var(--sf);
  padding: 16px 14px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
  position: relative;
}

.roadwrap::-webkit-scrollbar { height: 8px; }
.roadwrap::-webkit-scrollbar-track { background: var(--bg); border-radius: 4px; }
.roadwrap::-webkit-scrollbar-thumb { background: var(--bd); border-radius: 4px; }
.roadwrap::-webkit-scrollbar-thumb:hover { background: var(--mu); }

/* Buttons & Badges */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 16px;
  font-size: 0.86rem;
  font-weight: 600;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: var(--transition);
  border: 1px solid transparent;
  font-family: inherit;
  text-decoration: none;
}

.btn-primary { background: var(--ac); color: #fff; }
.btn-primary:hover { background: var(--ac-hover); }
.btn-secondary { background: var(--sf); border-color: var(--bd); color: var(--tx); }
.btn-secondary:hover { background: var(--sf-hover); border-color: var(--ac); }
.btn-outline { background: transparent; border-color: var(--bd); color: var(--mu); }
.btn-outline:hover { color: var(--tx); border-color: var(--tx); }
.btn-sm { padding: 4px 10px; font-size: 0.78rem; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 600;
  color: #fff;
}

.badge-not-started { background: rgba(100, 116, 139, 0.2); color: #94a3b8; }
.badge-in-progress { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
.badge-needs-revision { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
.badge-mastered { background: rgba(47, 191, 113, 0.2); color: #2fbf71; }
.badge-recommended { background: rgba(168, 85, 247, 0.25); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4); }

.tag {
  font-size: 12px;
  border: 1px solid var(--bd);
  border-radius: 20px;
  padding: 2px 9px;
  color: var(--mu);
}

/* Modals */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(4, 7, 14, 0.75);
  backdrop-filter: blur(4px);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal-card {
  background: var(--sf);
  border: 1px solid var(--bd);
  border-radius: var(--radius-xl);
  max-width: 650px; width: 100%; max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  padding: 26px;
  position: relative;
}
.modal-close-btn { position: absolute; top: 18px; right: 18px; background: transparent; border: none; color: var(--mu); cursor: pointer; font-size: 1.2rem; }

/* Code Container */
.code-container {
  background: #080b12;
  border: 1px solid var(--bd);
  border-radius: var(--radius-md);
  margin: 12px 0;
  overflow: hidden;
}
.code-header { padding: 6px 12px; background: #0f1422; border-bottom: 1px solid var(--bd); display: flex; align-items: center; justify-content: space-between; font-size: 0.72rem; font-family: var(--font-mono); color: var(--mu); }
.code-pre { padding: 14px; overflow-x: auto; font-family: var(--font-mono); font-size: 0.84rem; line-height: 1.55; color: #38d6e8; }
.code-output { padding: 10px 14px; background: #090e18; border-top: 1px dashed var(--bd); font-family: var(--font-mono); font-size: 0.78rem; color: #a7f3d0; }

/* Search & Toast */
.search-results-floating { display: none; position: fixed; top: 55px; right: 80px; width: 440px; max-height: 380px; overflow-y: auto; background: var(--sf); border: 1px solid var(--bd); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); z-index: 60; }
.search-results-floating.active { display: block; }
.search-item { padding: 10px 14px; border-bottom: 1px solid var(--bd); cursor: pointer; }
.search-item:hover { background: var(--sf-hover); }

.toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 120; }
.toast { background: var(--ac); color: #fff; padding: 8px 16px; border-radius: var(--radius-md); font-size: 0.85rem; box-shadow: var(--shadow-md); }

select, input, textarea {
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: var(--radius-md);
  padding: 7px 12px;
  color: var(--tx);
  font: inherit;
  font-size: 0.85rem;
  outline: none;
}
select:focus, input:focus, textarea:focus { border-color: var(--ac); }

</style>

/* --- frontend/js/static_roadmap_data.js --- */
/**
 * AI Engineer Learning OS - Static Curriculum Manifest
 * Embeds all 12 stages, icons, descriptions, and topics for instant static rendering & offline resilience.
 */

window.STATIC_STAGES = [
  { id: 1, name: "Programming Foundations", icon: "⚡", badge: "Core Foundation", color: "#38bdf8" },
  { id: 2, name: "Mathematics for AI", icon: "📐", badge: "Core Foundation", color: "#818cf8" },
  { id: 3, name: "Data Analysis & Processing", icon: "📊", badge: "Practical Data", color: "#34d399" },
  { id: 4, name: "Machine Learning", icon: "🤖", badge: "Applied ML", color: "#fbbf24" },
  { id: 5, name: "Deep Learning", icon: "🧠", badge: "Deep Learning", color: "#f472b6" },
  { id: 6, name: "Specialized Neural Networks", icon: "🔮", badge: "Architectures", color: "#c084fc" },
  { id: 7, name: "NLP and Large Language Models", icon: "💬", badge: "Modern LLMs", color: "#38d6e8" },
  { id: 8, name: "Retrieval-Augmented Generation (RAG)", icon: "🔍", badge: "Production RAG", color: "#2dd4bf" },
  { id: 9, name: "AI Agents and Tool Use", icon: "🦾", badge: "AI Agents", color: "#a855f7" },
  { id: 10, name: "Backend and AI App Dev", icon: "🚀", badge: "Engineering Systems", color: "#fb923c" },
  { id: 11, name: "AI Deployment and MLOps", icon: "📈", badge: "MLOps", color: "#22d3ee" },
  { id: 12, name: "Advanced AI Engineering", icon: "🛡️", badge: "Advanced Mastery", color: "#f87171" }
];

window.STATIC_TOPICS = [
  { id: "py_syntax", stage_id: 1, title: "Python Syntax & Variables", difficulty: "Beginner", estimated_hours: 3, prerequisites: [], importance: "The fundamental building block of all AI engineering code.", what_you_will_do: "Write clean Python scripts, declare variables with explicit types, and execute your first AI scripts." },
  { id: "py_operators", stage_id: 1, title: "Data Types & Operators", difficulty: "Beginner", estimated_hours: 2, prerequisites: ["py_syntax"], importance: "Underpins mathematical computations inside neural networks.", what_you_will_do: "Perform arithmetic, comparisons, boolean masks, and bitwise operations." },
  { id: "py_loops", stage_id: 1, title: "Conditions & Loops", difficulty: "Beginner", estimated_hours: 3, prerequisites: ["py_operators"], importance: "Iterating over training batches and token streams.", what_you_will_do: "Write robust if-elif branches, for-loops, and list comprehensions." },
  { id: "py_functions", stage_id: 1, title: "Functions & Scope", difficulty: "Beginner", estimated_hours: 4, prerequisites: ["py_loops"], importance: "Reusable modular code for training pipelines.", what_you_will_do: "Design modular functions with *args, **kwargs, and pure logic." },
  { id: "py_data_structures", stage_id: 1, title: "Lists, Tuples, Sets & Dicts", difficulty: "Beginner", estimated_hours: 4, prerequisites: ["py_functions"], importance: "Representing embeddings and token vocabularies.", what_you_will_do: "Select optimal collections, use hash maps for O(1) lookups." },
  { id: "py_strings", stage_id: 1, title: "String Manipulation & Regex", difficulty: "Beginner", estimated_hours: 3, prerequisites: ["py_data_structures"], importance: "Text cleaning and prompt parsing constitute 60% of LLM work.", what_you_will_do: "Clean messy crawls, parse markdown, and format prompt templates." },
  { id: "py_errors", stage_id: 1, title: "Error Handling & Debugging", difficulty: "Beginner+", estimated_hours: 3, prerequisites: ["py_functions"], importance: "Production AI pipelines encounter corrupted image files and timeouts.", what_you_will_do: "Write defensive try-except blocks and step through code with pdb." },
  { id: "py_files", stage_id: 1, title: "File Handling (JSON, CSV, Binary)", difficulty: "Beginner+", estimated_hours: 3, prerequisites: ["py_errors"], importance: "AI models ingest gigabytes of data and save checkpoints.", what_you_will_do: "Read and write JSON, CSV, and binary safetensors files safely." },
  { id: "py_modules", stage_id: 1, title: "Modules & Packages", difficulty: "Beginner+", estimated_hours: 2, prerequisites: ["py_files"], importance: "Organizing production codebases cleanly across packages.", what_you_will_do: "Structure reusable packages with __init__.py." },
  { id: "py_oop", stage_id: 1, title: "Object-Oriented Programming (OOP)", difficulty: "Intermediate", estimated_hours: 5, prerequisites: ["py_modules"], importance: "PyTorch models and agent tools are all built as OOP classes.", what_you_will_do: "Create classes, inherit from nn.Module, and override dunder methods." },
  { id: "py_virtual_envs", stage_id: 1, title: "Virtual Envs & Package Mgmt", difficulty: "Beginner+", estimated_hours: 2, prerequisites: ["py_modules"], importance: "Eliminates 'works on my machine' CUDA dependency conflicts.", what_you_will_do: "Isolate environments with venv/uv and pin exact versions." },
  { id: "py_git", stage_id: 1, title: "Git & GitHub for AI Projects", difficulty: "Beginner+", estimated_hours: 3, prerequisites: ["py_syntax"], importance: "Industry standard for version controlling AI code and models.", what_you_will_do: "Commit, branch, and configure .gitignore for weights and keys." },
  { id: "py_terminal", stage_id: 1, title: "Terminal & Shell Usage", difficulty: "Beginner", estimated_hours: 2, prerequisites: [], importance: "Cloud GPUs and Docker containers are controlled via CLI.", what_you_will_do: "Navigate file trees, monitor GPU memory, and pipe commands." },

/**
 * AI Engineer Learning OS - Universal API Client & Static Fallback Engine
 * Communicates with backend REST API when available, and seamlessly falls back
 * to in-browser local persistence if deployed on static web hosts (Vercel, Netlify, GitHub Pages).
 */

const API = {
  baseUrl: '',

  async request(endpoint, options = {}) {
    const defaultHeaders = {
      'Content-Type': 'application/json',
      'Accept': 'application/json'
    };

    try {
      const response = await fetch(`${this.baseUrl}${endpoint}`, {
        ...options,
        headers: {
          ...defaultHeaders,
          ...(options.headers || {})
        }
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      return await response.json();
    } catch (err) {
      // Fallback for static hosts (Vercel static / GitHub Pages)
      return this.handleStaticFallback(endpoint, options);
    }
  },

  // In-memory / localStorage fallback when running purely as static frontend
  handleStaticFallback(endpoint, options) {
    const cleanEndpoint = endpoint.split('?')[0].split('#')[0];
    const cachedData = localStorage.getItem('aieos_local_db');
    let localDB = cachedData ? JSON.parse(cachedData) : {
      topics_progress: {},
      quiz_history: {},
      project_progress: {},
      stats: { total_topics: 60, mastered: 0, in_progress: 0, needs_revision: 0, not_started: 60, completion_percentage: 0 }
    };

    if (cleanEndpoint === '/api/health') {
      return { status: 'healthy (static mode)', storage: 'Client LocalStorage' };
    }

    if (cleanEndpoint === '/api/roadmap') {
      return { stages: window.STATIC_STAGES || [], topics: window.STATIC_TOPICS || [] };
    }

    if (cleanEndpoint === '/api/progress') {
      return localDB;
    }

    if (cleanEndpoint === '/api/progress/topic' && options.method === 'POST') {
      const body = JSON.parse(options.body || '{}');
      const tid = body.topic_id;
      if (tid) {
        localDB.topics_progress[tid] = {
          topic_id: tid,
          status: body.status || 'in_progress',
          confidence_rating: body.confidence_rating || 3,
          personal_notes: body.personal_notes || '',
          last_studied_date: new Date().toISOString()
        };
        // Recompute stats
        const allT = window.STATIC_TOPICS || [];
        const m = Object.values(localDB.topics_progress).filter(p => p.status === 'mastered').length;
        const inp = Object.values(localDB.topics_progress).filter(p => p.status === 'in_progress').length;
        const rev = Object.values(localDB.topics_progress).filter(p => p.status === 'needs_revision').length;
        localDB.stats = {
          total_topics: allT.length,
          mastered: m,
          in_progress: inp,
          needs_revision: rev,
          not_started: allT.length - m - inp - rev,
          completion_percentage: Math.round((m / Math.max(allT.length, 1)) * 100)
        };
        localStorage.setItem('aieos_local_db', JSON.stringify(localDB));
      }
      return { success: true };
    }

    if (cleanEndpoint === '/api/recommendation') {
      const allT = window.STATIC_TOPICS || [];
      const first = allT[0] || { id: 'py_syntax', title: 'Python Syntax and Variables', stage_id: 1, difficulty: 'Beginner', estimated_hours: 3 };
      return {
        recommended_topic: first,
        reason: 'Essential foundational starting point for your AI Engineering journey.',
        satisfied_prerequisites: []
      };
    }

    if (cleanEndpoint.startsWith('/api/topic/')) {
      const tid = cleanEndpoint.replace('/api/topic/', '');
      const t = (window.STATIC_TOPICS || []).find(x => x.id === tid) || { id: tid, title: tid, stage_id: 1, key_concepts: [] };
      return {
        topic: t,
        stage: (window.STATIC_STAGES || [])[(t.stage_id || 1) - 1] || { id: 1, name: 'Foundations' },
        lesson: {
          part1_simple_explanation: { what_it_is: t.importance || t.title, why_it_exists: 'Essential for AI engineering workflows.', problem_it_solves: 'Eliminates errors.', real_world_use: 'Used across production AI systems.' },
          part2_analogy: { analogy_title: 'Intuitive Model', story: 'Think of this like an essential instrument in an engineer toolbox.', technical_difference: 'Executes in software.' },
          part3_visual_diagram: { title: `${t.title} Flow`, nodes: [{ label: 'Input', color: '#38bdf8' }, { label: 'Process', color: '#a855f7' }, { label: 'Output', color: '#22c55e' }], flow_steps: ['1. Data enters.', '2. Core logic executes.', '3. Emitted downstream.'] },
          part4_mechanism: ['Initialize inputs.', 'Execute transformation.', 'Validate output.'],
          part5_code: { beginner_example: { title: `${t.title} Demo`, code: `# Hands on with ${t.title}
print('Ready to learn ${t.title}')`, explanation: 'Simple demonstration code.', expected_output: `Ready to learn ${t.title}` } },
          part6_when_to_use: { use_cases: ['Foundation learning', 'Production ML'] },
          part7_problems_engineers_face: [{ problem: 'Configuration errors', symptoms: 'Fails to run', causes: 'Missing parameters', diagnosis: 'Inspect logs', fix: 'Add proper inputs', prevention: 'Unit test' }],
          part8_knowledge_check: {
            beginner_questions: [
              { question: `What is the primary role of ${t.title}?`, options: ['Core foundation for AI workflows', 'Irrelevant', 'Hardware only'], correct_idx: 0, explanation: 'Forms the core foundation.' },
              { question: 'Why is it important?', options: ['Ensures reliability and scalability', 'No reason', 'Just for fun'], correct_idx: 0, explanation: 'Prevents downstream bottlenecks.' }
            ]
          }
        }
      };
    }

    if (cleanEndpoint === '/api/revisions') {
      return { due_today: [], overdue: [], needs_revision: [], weak_concepts: [], counts: { due_today_count: 0, overdue_count: 0, needs_revision_count: 0, weak_concepts_count: 0 } };
    }

    if (cleanEndpoint === '/api/projects') {
      return { projects: [] };
    }

    return {};
  },

  async getHealth() { return this.request('/api/health'); },
  async getRoadmap() { return this.request('/api/roadmap'); },
  async getProgress() { return this.request('/api/progress'); },
  async updateTopicProgress(payload) { return this.request('/api/progress/topic', { method: 'POST', body: JSON.stringify(payload) }); },
  async getRecommendation() { return this.request('/api/recommendation'); },
  async getTopicLesson(topicId) { return this.request(`/api/topic/${encodeURIComponent(topicId.split('#')[0].split('?')[0])}`); },
  async getPrerequisitesTree(topicId) { return this.request(`/api/prerequisites/${encodeURIComponent(topicId.split('#')[0].split('?')[0])}`); },
  async submitQuiz(payload) { return this.request('/api/quiz/submit', { method: 'POST', body: JSON.stringify(payload) }); },
  async getRevisions() { return this.request('/api/revisions'); },
  async getProjects() { return this.request('/api/projects'); },
  async updateProjectStatus(payload) { return this.request('/api/projects/status', { method: 'POST', body: JSON.stringify(payload) }); },
  async uploadStudyMaterial(payload) { return this.request('/api/upload', { method: 'POST', body: JSON.stringify(payload) }); },
  async confirmUploadTopics(payload) { return this.request('/api/upload/confirm', { method: 'POST', body: JSON.stringify(payload) }); },
  async exportData() { return this.request('/api/export'); },
  async importData(payload) { return this.request('/api/import', { method: 'POST', body: JSON.stringify(payload) }); },
  async resetData() { return this.request('/api/reset', { method: 'POST', body: JSON.stringify({}) }); }
};

/**
 * AI Engineer Learning OS - Interactive Learning Roadmap View
 * Renders the multi-stage horizontal dependency node graph with smooth curved bezier arrows,
 * status color-coding, interactive hover highlights, and direct navigation to topic lessons.
 */

const RoadmapView = {
  activeHoverId: null,

  render(container, state) {
    const { stages, topics, progress, recommendation } = state;
    const progressMap = progress?.topics_progress || {};
    const recommendedId = recommendation?.recommended_topic?.id;

    // Dimensions & Grid metrics
    const cw = 175; // column width
    const nw = 148; // node width
    const rh = 52;  // row height
    const pos = {};
    const cnt = {};

    // Group topics by stage and compute coordinates
    topics.forEach(t => {
      // stages are 1-indexed in topics (1 to 12), map to 0-indexed column (0 to 11)
      const stageIdx = (t.stage_id ? t.stage_id - 1 : t.stage) || 0;
      const i = cnt[stageIdx] || 0;
      cnt[stageIdx] = i + 1;
      pos[t.id] = {
        x: stageIdx * cw + 16,
        y: 45 + i * rh,
        stageIdx: stageIdx
      };
    });

    const maxRows = Math.max(...Object.values(cnt), 10);
    const H = maxRows * rh + 65;
    const W = 12 * cw + 40;

    // Generate Stage Column Headers
    const stageNames = [
      "1. Programming", "2. Math for AI", "3. Data Analysis",
      "4. Machine Learning", "5. Deep Learning", "6. Specialized Nets",
      "7. NLP & LLMs", "8. RAG", "9. Agents",
      "10. Backend", "11. MLOps", "12. Advanced"
    ];

    let headerSvg = "";
    stageNames.forEach((sName, i) => {
      const x = i * cw + 16;
      headerSvg += `
        <text x="${x}" y="24" font-size="12" font-weight="700" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
          ${sName}
        </text>
      `;
    });

    // Generate Connecting Arrows (Curved cubic beziers)
    let edgesSvg = "";
    topics.forEach(t => {
      (t.prerequisites || t.pre || []).forEach(pId => {
        const a = pos[pId];
        const b = pos[t.id];
        if (!a || !b) return;

        const y1 = a.y + 17;
        const y2 = b.y + 17;

        let pathD = "";
        if (a.stageIdx === b.stageIdx) {
          // Same column curve out to right and back
          pathD = `M ${a.x + nw} ${y1} C ${a.x + nw + 35} ${y1}, ${b.x + nw + 35} ${y2}, ${b.x + nw} ${y2}`;
        } else {
          // Inter-column cubic bezier
          const midX = (a.x + nw + b.x) / 2;
          pathD = `M ${a.x + nw} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${b.x} ${y2}`;
        }

        edgesSvg += `
          <path class="roadmap-edge edge-from-${pId} edge-to-${t.id}"
                data-from="${pId}" data-to="${t.id}"
                d="${pathD}"
                fill="none"
                stroke="#64748b"
                stroke-width="1.3"
                stroke-opacity="0.32"
                marker-end="url(#ar)" />
        `;
      });
    });

    // Generate Topic Nodes
    let nodesSvg = "";
    topics.forEach(t => {
      const p = pos[t.id];
      if (!p) return;

      const userProg = progressMap[t.id] || { status: "not_started" };
      const status = userProg.status || "not_started";
      const isRecommended = (t.id === recommendedId);

      // Color mapping matching prompt & reference:
      // Gray=Not started, Blue=In progress, Amber=Needs revision, Green=Mastered, Purple=Recommended next
      let strokeColor = "#475569";
      let fillBg = "rgba(71, 85, 105, 0.16)";
      let textColor = "#f1f5f9";
      let strokeWidth = "1.5";

      if (isRecommended) {
        strokeColor = "#a855f7"; // Purple
        fillBg = "rgba(168, 85, 247, 0.22)";
        strokeWidth = "2.5";
      } else if (status === "mastered") {
        strokeColor = "#22c55e"; // Green
        fillBg = "rgba(34, 197, 94, 0.18)";
      } else if (status === "in_progress") {
        strokeColor = "#3b82f6"; // Blue
        fillBg = "rgba(59, 130, 246, 0.20)";
      } else if (status === "needs_revision") {
        strokeColor = "#f59e0b"; // Amber
        fillBg = "rgba(245, 158, 11, 0.20)";
      }

      const displayName = t.title || t.name || t.id;
      const truncatedName = displayName.length > 21 ? displayName.slice(0, 19) + "…" : displayName;

      nodesSvg += `
        <g class="roadmap-node-g"
           id="node-g-${t.id}"
           data-topic-id="${t.id}"
           tabindex="0"
           role="button"
           style="cursor: pointer;"
           onclick="App.openTopicLesson('${t.id}')">
          <title>${displayName} (${status.replace('_', ' ')})&#10;${t.importance || ''}</title>
          
          <rect id="rect-${t.id}"
                x="${p.x}" y="${p.y}"
                width="${nw}" height="35"
                rx="8" ry="8"
                fill="${fillBg}"
                stroke="${strokeColor}"
                stroke-width="${strokeWidth}"
                style="transition: all 0.2s ease;" />

          <text x="${p.x + 10}" y="${p.y + 22}"
                font-size="12"
                font-weight="500"
                fill="${textColor}"
                font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
                pointer-events="none">
            ${truncatedName}
          </text>
        </g>
      `;
    });

    let html = `
      <!-- Header Card matching reference -->
      <div class="card" style="padding: 22px 26px; margin-bottom: 20px;">
        <h1 style="font-size: 1.55rem; font-weight: 800; color: #fff; margin-bottom: 4px;">Learning roadmap</h1>
        <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 14px;">

        <div class="leg" style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; font-size: 0.82rem;">
          <span style="display: inline-flex; align-items: center; gap: 6px;">
            <i style="width: 10px; height: 10px; border-radius: 3px; background: #64748b; display: inline-block;"></i>
            <span>Not Started</span>
          </span>
          <span style="display: inline-flex; align-items: center; gap: 6px;">
            <i style="width: 10px; height: 10px; border-radius: 3px; background: #3b82f6; display: inline-block;"></i>
            <span>In Progress</span>
          </span>
          <span style="display: inline-flex; align-items: center; gap: 6px;">
            <i style="width: 10px; height: 10px; border-radius: 3px; background: #f59e0b; display: inline-block;"></i>
            <span>Needs Revision</span>
          </span>
          <span style="display: inline-flex; align-items: center; gap: 6px;">
            <i style="width: 10px; height: 10px; border-radius: 3px; background: #22c55e; display: inline-block;"></i>
            <span>Mastered</span>
          </span>
          <span style="display: inline-flex; align-items: center; gap: 6px;">
            <i style="width: 10px; height: 10px; border-radius: 3px; background: #a855f7; box-shadow: 0 0 6px #a855f7; display: inline-block;"></i>
            <span style="font-weight: 600; color: #c084fc;">Recommended next</span>
          </span>
        </div>
      </div>

      <!-- Horizontal Side-Scrolling Roadmap Container matching reference -->
      <div class="roadwrap" style="
        overflow-x: auto;
        overflow-y: hidden;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        background: #0d111a;
        padding: 16px 12px;
        box-shadow: var(--shadow-sm);
        position: relative;
      ">
        <svg width="${W}" height="${H}" role="img" aria-label="Interactive AI Roadmap Graph" style="display: block;">
          <defs>
            <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 0 L 8 4 L 0 8 z" fill="#64748b" opacity="0.6"/>
            </marker>
            <marker id="ar-highlight-in" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
              <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8"/>
            </marker>
            <marker id="ar-highlight-out" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
              <path d="M 0 0 L 8 4 L 0 8 z" fill="#a855f7"/>
            </marker>
          </defs>

          <!-- Stage Column Headers -->
          ${headerSvg}

          <!-- Prerequisite Curves -->
          <g id="edges-group">
            ${edgesSvg}
          </g>

          <!-- Nodes -->
          <g id="nodes-group">
            ${nodesSvg}
          </g>
        </svg>
      </div>
    `;

    container.innerHTML = html;
    this.attachGraphInteractions(container);
  },

  attachGraphInteractions(container) {
    const nodeGroups = container.querySelectorAll('.roadmap-node-g');
    const edges = container.querySelectorAll('.roadmap-edge');

    nodeGroups.forEach(g => {
      const topicId = g.getAttribute('data-topic-id');
      const rect = g.querySelector('rect');

      g.addEventListener('mouseenter', () => {
        // Dim all edges slightly
        edges.forEach(e => {
          e.style.strokeOpacity = '0.08';
          e.style.strokeWidth = '1';
        });

        // Highlight incoming prerequisite edges (in Cyan)
        const inEdges = container.querySelectorAll(`.edge-to-${topicId}`);
        inEdges.forEach(e => {
          e.style.stroke = '#38bdf8';
          e.style.strokeWidth = '2.5';
          e.style.strokeOpacity = '1';
          e.setAttribute('marker-end', 'url(#ar-highlight-in)');
        });

        // Highlight outgoing dependent edges (in Purple)
        const outEdges = container.querySelectorAll(`.edge-from-${topicId}`);
        outEdges.forEach(e => {
          e.style.stroke = '#a855f7';
          e.style.strokeWidth = '2.5';
          e.style.strokeOpacity = '1';
          e.setAttribute('marker-end', 'url(#ar-highlight-out)');
        });

        if (rect) {
          rect.style.filter = 'drop-shadow(0 0 8px rgba(56, 189, 248, 0.4))';
        }
      });

      g.addEventListener('mouseleave', () => {
        // Reset all edges
        edges.forEach(e => {
          e.style.stroke = '#64748b';
          e.style.strokeWidth = '1.3';
          e.style.strokeOpacity = '0.32';
          e.setAttribute('marker-end', 'url(#ar)');
        });

        if (rect) {
          rect.style.filter = 'none';
        }
      });
    });
  }
};

  generateDiagramSvg(nodes) {
    if (!nodes || nodes.length === 0) return '';
    const nodeWidth = 160;
    const nodeHeight = 70;
    const spacing = 45;
    const startX = 20;
    const startY = 75;

    let svgHtml = '';
    nodes.forEach((node, i) => {
      const x = startX + i * (nodeWidth + spacing);
      const y = startY;

      // Draw connection arrow to next node
      if (i < nodes.length - 1) {
        const arrowStartX = x + nodeWidth;
        const arrowEndX = arrowStartX + spacing;
        svgHtml += `
          <line x1="${arrowStartX}" y1="${y + nodeHeight / 2}" x2="${arrowEndX - 5}" y2="${y + nodeHeight / 2}"
                stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
        `;
      }

      // Draw Node Box
      svgHtml += `
        <g class="diagram-svg-node" id="svg-node-${i}" style="cursor: pointer;">
          <rect x="${x}" y="${y}" width="${nodeWidth}" height="${nodeHeight}" rx="8"
                fill="#111827" stroke="${node.color}" stroke-width="2" />
          <text x="${x + nodeWidth / 2}" y="${y + 28}" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle" font-family="Plus Jakarta Sans">
            ${this.truncate(node.label, 22)}
          </text>
          <text x="${x + nodeWidth / 2}" y="${y + 48}" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="Plus Jakarta Sans">
            ${this.truncate(node.desc, 26)}
          </text>
        </g>
      `;
    });

    return svgHtml;
  },

  truncate(str, max) {
    if (!str) return '';
    return str.length > max ? str.substring(0, max - 3) + '...' : str;
  },

  escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  },

  attachEventListeners(container, topic) {
    // Confidence slider display
    const confSlider = container.querySelector('#update-confidence-range');
    const confDisplay = container.querySelector('#conf-val-display');
    if (confSlider && confDisplay) {
      confSlider.addEventListener('input', (e) => {
        confDisplay.textContent = `${e.target.value} / 5`;
      });
    }

    // Save topic progress button
    const saveBtn = container.querySelector('#btn-save-topic-progress');
    if (saveBtn) {
      saveBtn.addEventListener('click', async () => {
        const newStatus = container.querySelector('#update-topic-status-select').value;
        const newConfidence = parseInt(container.querySelector('#update-confidence-range').value);
        const newNotes = container.querySelector('#update-personal-notes-input').value;

        try {
          saveBtn.disabled = true;
          saveBtn.textContent = 'Saving...';
          await API.updateTopicProgress({
            topic_id: topic.id,
            status: newStatus,
            confidence_rating: newConfidence,
            personal_notes: newNotes,
            mark_studied_now: true,
            evidence_type: newStatus === 'mastered' ? 'mastery_confirmed' : 'user_confirmed',
            evidence_ref: `Status set to ${newStatus}`
          });
          App.showToast(`Saved progress for ${topic.title}`);
          await App.refreshGlobalState();
          this.renderContent(container, App.state);
        } catch (err) {
          alert(`Error saving progress: ${err.message}`);
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Progress & Evidence';
        }
      });
    }

    // Diagram Step Player
    const steps = this.lessonData.lesson.part3_visual_diagram?.flow_steps || [];
    const prevBtn = container.querySelector('#btn-prev-diagram-step');
    const nextBtn = container.querySelector('#btn-next-diagram-step');
    const stepText = container.querySelector('#diagram-active-step-text');

    if (steps.length > 0 && prevBtn && nextBtn && stepText) {
      this.activeDiagramStep = 0;
      prevBtn.addEventListener('click', () => {
        if (this.activeDiagramStep > 0) {
          this.activeDiagramStep--;
          stepText.textContent = steps[this.activeDiagramStep];
        }
      });
      nextBtn.addEventListener('click', () => {
        if (this.activeDiagramStep < steps.length - 1) {
          this.activeDiagramStep++;
          stepText.textContent = steps[this.activeDiagramStep];
        }
      });
    }

    // Toggle hint and solutions
    const hintBtn = container.querySelector('#btn-toggle-debug-hint');
    const hintBox = container.querySelector('#debug-hint-box');
    if (hintBtn && hintBox) {
      hintBtn.addEventListener('click', () => {
        hintBox.style.display = hintBox.style.display === 'none' ? 'block' : 'none';
      });
    }

    const solBtn = container.querySelector('#btn-toggle-debug-sol');
    const solBox = container.querySelector('#debug-sol-box');
    if (solBtn && solBox) {
      solBtn.addEventListener('click', () => {
        solBox.style.display = solBox.style.display === 'none' ? 'block' : 'none';
      });
    }

    const exSolBtn = container.querySelector('#btn-toggle-exercise-sol');
    const exSolBox = container.querySelector('#exercise-sol-box');
    if (exSolBtn && exSolBox) {
      exSolBtn.addEventListener('click', () => {
        exSolBox.style.display = exSolBox.style.display === 'none' ? 'block' : 'none';
      });
    }

    // Quiz Submission Button
    const quizBtn = container.querySelector('#btn-submit-lesson-quiz');
    if (quizBtn) {
      quizBtn.addEventListener('click', async () => {
        const p8 = this.lessonData.lesson.part8_knowledge_check || {};
        const begQ = p8.beginner_questions || [];
        const appQ = p8.application_questions || [];
        let totalQuestions = begQ.length + appQ.length;
        let score = 0;

        // Evaluate Beginner
        begQ.forEach((q, idx) => {
          const selected = container.querySelector(`input[name="q_beg_${idx}"]:checked`);
          const fb = container.querySelector(`#feedback_beg_${idx}`);
          if (fb) {
            fb.style.display = 'block';
            if (selected && parseInt(selected.value) === q.correct_idx) {
              score++;
              fb.style.background = 'rgba(16, 185, 129, 0.15)';
              fb.style.color = '#34d399';
              fb.innerHTML = `<strong>Correct!</strong> ${q.explanation}`;
            } else {
              fb.style.background = 'rgba(244, 63, 94, 0.15)';
              fb.style.color = '#fb7185';
              fb.innerHTML = `<strong>Incorrect.</strong> Correct answer: "${q.options[q.correct_idx]}". ${q.explanation}`;
            }
          }
        });

        // Evaluate Application
        appQ.forEach((q, idx) => {
          const selected = container.querySelector(`input[name="q_app_${idx}"]:checked`);
          const fb = container.querySelector(`#feedback_app_${idx}`);
          if (fb) {
            fb.style.display = 'block';
            if (selected && parseInt(selected.value) === q.correct_idx) {
              score++;
              fb.style.background = 'rgba(16, 185, 129, 0.15)';
              fb.style.color = '#34d399';
              fb.innerHTML = `<strong>Correct!</strong> ${q.explanation}`;
            } else {
              fb.style.background = 'rgba(244, 63, 94, 0.15)';
              fb.style.color = '#fb7185';
              fb.innerHTML = `<strong>Incorrect.</strong> Correct answer: "${q.options[q.correct_idx]}". ${q.explanation}`;
            }
          }
        });

        // Submit to API
        try {
          const res = await API.submitQuiz({
            topic_id: topic.id,
            score: score,
            total_questions: totalQuestions
          });
          const percent = Math.round((score / totalQuestions) * 100);
          App.showToast(`Quiz Submitted: ${score}/${totalQuestions} (${percent}%) - ${res.passed ? 'PASSED' : 'NEEDS REVISION'}`);
          await App.refreshGlobalState();
        } catch (err) {
          alert(`Failed to save quiz result: ${err.message}`);
        }
      });
    }
  }
};

        <input type="file" id="upload-file-input" style="display: none;" accept=".txt,.md,.py,.json,.csv,.pdf,.png,.jpg,.jpeg">
        
        <div style="width: 52px; height: 52px; margin: 0 auto 16px; border-radius: 50%; background: var(--accent-blue-subtle); display: flex; align-items: center; justify-content: center; color: var(--accent-blue);">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        </div>

        <h3 style="font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 6px;">Drag and drop your study files here</h3>
        <p style="font-size: 0.85rem; color: var(--text-muted); max-width: 500px; margin: 0 auto 18px;">
          Supports Markdown, Python code, TXT notes, PDFs, and screenshots.
        </p>

        <div style="display: flex; gap: 12px; justify-content: center; align-items: center;">
          <button class="btn btn-primary" onclick="document.getElementById('upload-file-input').click()">
            Browse Files

          <button class="btn btn-secondary" id="btn-load-sample-notes">
            Load Sample Notes

        </div>

        <div id="upload-status-indicator" style="display: none; margin-top: 18px; font-size: 0.85rem; color: var(--accent-cyan);">
          Processing file and matching concepts against roadmap...
        </div>
      </div>

      <!-- Analysis & Review Screen Container -->
      <div id="upload-review-container">
        ${this.renderReviewSection(this.lastAnalysis)}
      </div>
    `;

    container.innerHTML = html;
    this.attachEventListeners(container);
  },

  renderReviewSection(data) {
    if (!data) {
      return `
        <div class="card" style="padding: 24px; text-align: center; color: var(--text-dim); font-size: 0.85rem;">
          No file analyzed yet. Upload study material or click "Load Sample Notes" above to begin.
        </div>
      `;
    }

    const analysis = data.analysis;
    const groupA = analysis.group_a_found || [];
    const groupB = analysis.group_b_already_learned || [];
    const groupC = analysis.group_c_missing_or_further_study || [];

    return `
      <div class="card" style="border: 2px solid var(--accent-blue); padding: 24px; margin-bottom: 24px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px;">
          <div>
            <span class="badge badge-recommended">Analysis Review Screen</span>
            <h2 style="font-size: 1.3rem; font-weight: 800; color: #fff; margin-top: 4px;">
              Extracted from: ${data.filename}
            </h2>
            <div style="font-size: 0.78rem; color: var(--text-dim); margin-top: 2px;">
              Parser: ${data.parser_type} | Characters: ${analysis.text_length} | Detected Concepts: ${analysis.total_concepts_detected}
            </div>
          </div>

          <div style="display: flex; gap: 10px;">
            <button class="btn btn-primary" id="btn-confirm-upload-changes">
              Confirm & Save Progress Updates
            </button>
          </div>
        </div>

        ${data.diagnostics?.ocr_status ? `
          <div style="background: rgba(245, 158, 11, 0.08); border-left: 3px solid var(--accent-amber); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.8rem; margin-bottom: 20px;">
            <strong style="color: var(--accent-amber);">Parser Transparency Note:</strong>
            ${data.diagnostics.ocr_status} ${data.diagnostics.note || ''}
          </div>
        ` : ''}

        <!-- 3 Mandated Groups Display -->
        <div style="display: flex; flex-direction: column; gap: 24px;">

          <!-- GROUP A: Topics Found in Material -->
          <div style="background-color: var(--bg-card-subtle); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 18px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
              <div>
                <span class="badge" style="background: rgba(59, 130, 246, 0.15); color: #60a5fa; font-weight: 700;">GROUP A</span>
                <h3 style="font-size: 1.05rem; font-weight: 700; color: var(--text-main); margin-top: 2px;">
                  Topics Detected in Upload (${groupA.length})
                </h3>
              </div>
              <span style="font-size: 0.75rem; color: var(--text-dim);">Check items you wish to update in your progress</span>
            </div>

            ${groupA.length === 0 ? `
              <p style="color: var(--text-dim); font-size: 0.85rem;">No direct roadmap topic matches identified in this excerpt.</p>
            ` : `
              <div style="display: flex; flex-direction: column; gap: 10px;">
                ${groupA.map((t, idx) => `
                  <div style="display: flex; align-items: flex-start; justify-content: space-between; background: var(--bg-card); padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); flex-wrap: wrap; gap: 10px;">
                    <div style="display: flex; align-items: flex-start; gap: 12px;">
                      <input type="checkbox" class="upload-confirm-checkbox" data-topic-id="${t.topic_id}" checked style="margin-top: 4px; cursor: pointer;">
                      <div>
                        <div style="font-weight: 700; font-size: 0.92rem; color: #fff;">
                          ${t.title}
                          <span style="font-size: 0.72rem; color: var(--accent-cyan); font-weight: 500; margin-left: 8px;">Stage ${t.stage_id}</span>
                        </div>
                        <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 2px;">
                          Matched: <span style="color: var(--text-main); font-family: var(--font-mono);">${t.matched_terms.join(', ')}</span>
                        </div>
                        ${t.context_snippet ? `
                          <div style="font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; font-style: italic;">
                            "${t.context_snippet}"
                          </div>
                        ` : ''}
                      </div>
                    </div>

                    <div style="display: flex; align-items: center; gap: 10px;">
                      <select class="upload-status-select" data-topic-id="${t.topic_id}" style="background: var(--bg-card-subtle); border: 1px solid var(--border-subtle); color: var(--text-main); padding: 4px 8px; border-radius: var(--radius-sm); font-size: 0.78rem;">
                        <option value="in_progress">Set In Progress</option>
                        <option value="needs_revision">Set Needs Revision</option>
                        <option value="mastered">Set Mastered</option>
                      </select>
                      <span class="badge" style="background: rgba(16, 185, 129, 0.15); color: #34d399; font-family: var(--font-mono);">${t.match_score}% Match</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>

          <!-- GROUP B: Topics Already Learned -->
          <div style="background-color: var(--bg-card-subtle); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 18px;">
            <div style="margin-bottom: 12px;">
              <span class="badge" style="background: rgba(16, 185, 129, 0.15); color: #34d399; font-weight: 700;">GROUP B</span>
              <h3 style="font-size: 1.05rem; font-weight: 700; color: var(--text-main); margin-top: 2px;">
                Topics Already Recorded as Learned (${groupB.length})
              </h3>
            </div>

            ${groupB.length === 0 ? `
              <p style="color: var(--text-dim); font-size: 0.85rem;">None of the detected concepts have previously been marked as learned.</p>
            ` : `
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px;">
                ${groupB.map(t => `
                  <div style="background: var(--bg-card); padding: 10px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
                    <div style="font-weight: 600; font-size: 0.86rem; color: var(--text-main);">${t.title}</div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 0.72rem;">
                      <span class="badge badge-${t.status.replace('_', '-')}">${t.status}</span>
                      <span style="color: var(--text-dim); font-family: var(--font-mono);">${t.confidence_rating}/5 Confidence</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>

          <!-- GROUP C: Missing or Requiring Further Study -->
          <div style="background-color: var(--bg-card-subtle); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 18px;">
            <div style="margin-bottom: 12px;">
              <span class="badge" style="background: rgba(245, 158, 11, 0.15); color: #fbbf24; font-weight: 700;">GROUP C</span>
              <h3 style="font-size: 1.05rem; font-weight: 700; color: var(--text-main); margin-top: 2px;">
                Topics That May Be Missing or Require Further Study (${groupC.length})
              </h3>
              <p style="font-size: 0.78rem; color: var(--text-muted); margin-top: 2px;">
                These foundational prerequisites are required for the uploaded material but have not yet been mastered.
              </p>
            </div>

            ${groupC.length === 0 ? `
              <p style="color: var(--text-dim); font-size: 0.85rem;">No prerequisite gaps detected! Your foundations fully support this material.</p>
            ` : `
              <div style="display: flex; flex-direction: column; gap: 8px;">
                ${groupC.map(t => `
                  <div style="display: flex; align-items: center; justify-content: space-between; background: var(--bg-card); padding: 10px 14px; border-radius: var(--radius-sm); border-left: 3px solid var(--accent-amber); flex-wrap: wrap; gap: 8px;">
                    <div>
                      <div style="font-weight: 600; font-size: 0.88rem; color: #fff;">
                        ${t.title}
                        <span style="font-size: 0.72rem; color: var(--text-dim); margin-left: 6px;">Stage ${t.stage_id}</span>
                      </div>
                      <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;">${t.reason}</div>
                    </div>
                    <button class="btn btn-outline btn-sm" onclick="App.openTopicLesson('${t.topic_id}')">
                      Study Prerequisite →
                    </button>
                  </div>
                `).join('')}
              </div>
            `}
          </div>

        </div>
      </div>
    `;
  },

  attachEventListeners(container) {
    const fileInput = container.querySelector('#upload-file-input');
    const dropzone = container.querySelector('#upload-dropzone');
    const sampleBtn = container.querySelector('#btn-load-sample-notes');

    if (fileInput) {
      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) {
          await this.processFile(file, container);
        }
      });
    }

    if (dropzone) {
      dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.style.borderColor = 'var(--accent-blue)';
      });
      dropzone.addEventListener('dragleave', () => {
        dropzone.style.borderColor = 'var(--border-highlight)';
      });
      dropzone.addEventListener('drop', async (e) => {
        e.preventDefault();
        dropzone.style.borderColor = 'var(--border-highlight)';
        const file = e.dataTransfer.files[0];
        if (file) {
          await this.processFile(file, container);
        }
      });
    }

    if (sampleBtn) {
      sampleBtn.addEventListener('click', async () => {
        const sampleText = `
# Comprehensive Machine Learning & Transformer Deep Dive
Today we reviewed:
- Python syntax and variables, type hints, and conditional loops.
- Mathematics for AI: Vectors and matrices, transpose operations, and dot products.
- Linear Regression, Mean Squared Error (MSE), and Gradient Descent weight updates: w = w - eta * grad.
- Transformers and Self-Attention mechanisms: Query, Key, and Value dot-product attention:
  Attention(Q, K, V) = softmax(QK^T / sqrt(d_k))V
- Prompt Engineering: few-shot exemplars and Chain-of-Thought (CoT).
        `;
        await this.analyzeContent(sampleText, 'sample_notes_ml_transformers.md', container);
      });
    }

    this.attachConfirmListener(container);
  },

  async processFile(file, container) {
    const status = container.querySelector('#upload-status-indicator');
    if (status) status.style.display = 'block';

    const reader = new FileReader();
    const ext = file.name.split('.').pop().toLowerCase();

    if (['png', 'jpg', 'jpeg', 'webp', 'pdf'].includes(ext)) {
      reader.onload = async () => {
        const base64 = reader.result.split(',')[1];
        await this.sendUploadPayload({ filename: file.name, base64_content: base64 }, container);
      };
      reader.readAsDataURL(file);
    } else {
      reader.onload = async () => {
        await this.analyzeContent(reader.result, file.name, container);
      };
      reader.readAsText(file);
    }
  },

  async analyzeContent(textContent, filename, container) {
    await this.sendUploadPayload({ filename, text_content: textContent }, container);
  },

  async sendUploadPayload(payload, container) {
    try {
      const result = await API.uploadStudyMaterial(payload);
      this.lastAnalysis = result;
      const reviewBox = container.querySelector('#upload-review-container');
      if (reviewBox) {
        reviewBox.innerHTML = this.renderReviewSection(this.lastAnalysis);
        this.attachConfirmListener(container);
        App.showToast(`Analyzed ${result.filename}: ${result.analysis.total_concepts_detected} concepts detected.`);
      }
    } catch (err) {
      alert(`Upload analysis error: ${err.message}`);
    } finally {
      const status = container.querySelector('#upload-status-indicator');
      if (status) status.style.display = 'none';
    }
  },

  attachConfirmListener(container) {
    const confirmBtn = container.querySelector('#btn-confirm-upload-changes');
    if (confirmBtn && this.lastAnalysis) {
      confirmBtn.addEventListener('click', async () => {
        const checkedBoxes = container.querySelectorAll('.upload-confirm-checkbox:checked');
        const confirmedTopics = [];

        checkedBoxes.forEach(cb => {
          const tid = cb.getAttribute('data-topic-id');
          const select = container.querySelector(`.upload-status-select[data-topic-id="${tid}"]`);
          const status = select ? select.value : 'in_progress';
          confirmedTopics.push({ topic_id: tid, status: status, confidence: 2 });
        });

        if (confirmedTopics.length === 0) {
          alert('Please select at least one topic checkbox to confirm.');
          return;
        }

        try {
          confirmBtn.disabled = true;
          confirmBtn.textContent = 'Saving...';
          const res = await API.confirmUploadTopics({
            upload_id: this.lastAnalysis.upload_id,
            filename: this.lastAnalysis.filename,
            confirmed_topics: confirmedTopics
          });
          App.showToast(res.message);
          await App.refreshGlobalState();
          App.navigate('dashboard');
        } catch (err) {
          alert(`Failed to confirm upload changes: ${err.message}`);
        } finally {
          confirmBtn.disabled = false;
          confirmBtn.textContent = 'Confirm & Save Progress Updates';
        }
      });
    }
  }
};

/**

const PracticeView = {

    const { topics, progress } = state;

    let html = `

};

  async init() {
    this.setupTheme();
    this.setupNavigation();
    this.setupGlobalSearch();
    this.setupShortcuts();

    await this.refreshGlobalState();
    this.navigate('dashboard');

  async refreshGlobalState() {
    try {
      const [roadmapData, progressData, recData, revData] = await Promise.all([
        API.getRoadmap(),
        API.getProgress(),
        API.getRecommendation(),
        API.getRevisions()
      ]);

      this.state.stages = roadmapData.stages;
      this.state.topics = roadmapData.topics;
      this.state.progress = progressData;
      this.state.recommendation = recData;
      this.state.revisions = revData;

      // Update revision badges
      const revBadge = document.getElementById('header-rev-count');
      if (revBadge) {
        const revCount = (revData.counts?.due_today_count || 0) + (revData.counts?.needs_revision_count || 0);
        revBadge.textContent = revCount;
        revBadge.style.display = revCount > 0 ? 'inline-block' : 'none';
      }
    } catch (err) {
      console.error('[App] State initialization error:', err);
      this.showToast('Connecting to local storage database...');
    }
  },

  navigate(viewId, params = {}) {
    this.currentView = viewId;

    // Update active nav item
    document.querySelectorAll('.header-nav .nav-btn').forEach(item => {
      item.classList.toggle('active', item.getAttribute('data-view') === viewId);
    });

    // Hide all view panels
    document.querySelectorAll('.view-panel').forEach(panel => {
      panel.classList.remove('active');
    });

    // Show target view panel
    const targetPanel = document.getElementById(`view-${viewId}`);
    if (targetPanel) {
      targetPanel.classList.add('active');
      this.renderView(viewId, targetPanel, params);
    }

    // Scroll to top
    const scrollArea = document.querySelector('.content-scroll-area');
    if (scrollArea) scrollArea.scrollTop = 0;
  },

  renderView(viewId, container, params) {
    switch (viewId) {
      case 'dashboard':
        this.renderDashboard(container);
        break;
      case 'roadmap':
        RoadmapView.render(container, this.state);
        break;
      case 'learn':
        const topicId = params.topicId || this.state.recommendation?.recommended_topic?.id || 'py_syntax';
        LessonView.render(container, topicId, this.state);
        break;
      case 'topics':
        this.renderTopicsDirectory(container);
        break;
      case 'upload':
        UploadView.render(container, this.state);
        break;
      case 'practice':
        PracticeView.render(container, this.state);
        break;
      case 'projects':
        ProjectsView.render(container, this.state);
        break;
      case 'revision':
        this.renderRevisionCenter(container);
        break;
      case 'analytics':
        this.renderAnalytics(container);
        break;
      case 'settings':
        this.renderSettings(container);
        break;
      default:
        this.renderDashboard(container);
    }
  },

      return `

    if (box) {

  attachDashboardListeners(container) {
    const searchInput = container.querySelector('#pending-search-input');
    const stageFilter = container.querySelector('#pending-stage-filter');
    const diffFilter = container.querySelector('#pending-diff-filter');
    const listContainer = container.querySelector('#pending-topics-list-container');

    const updateFilter = () => {
      const q = (searchInput?.value || '').toLowerCase().trim();
      const sVal = stageFilter?.value || 'all';
      const dVal = diffFilter?.value || 'all';

      const filtered = this.state.topics.filter(t => {
        const pStatus = this.state.progress?.topics_progress?.[t.id]?.status;
        if (pStatus === 'mastered') return false;
        if (sVal !== 'all' && t.stage_id !== parseInt(sVal)) return false;
        if (dVal !== 'all' && !t.difficulty.includes(dVal)) return false;
        if (q && !(t.title + ' ' + t.importance).toLowerCase().includes(q)) return false;
        return true;
      });

      if (listContainer) {
        listContainer.innerHTML = this.renderPendingRows(filtered);
      }
    };

    if (searchInput) searchInput.addEventListener('input', updateFilter);
    if (stageFilter) stageFilter.addEventListener('change', updateFilter);
    if (diffFilter) diffFilter.addEventListener('change', updateFilter);
  },

  attachTopicsDirectoryListeners(container) {
    const fs = this.topicsFilterState;

    // Search Box
    const searchBox = container.querySelector('#topics-search-box');
    if (searchBox) {
      searchBox.addEventListener('input', (e) => {
        fs.search = e.target.value;
        this.renderTopicsDirectory(container);
      });
    }

    // View Mode Toggle
    const gridBtn = container.querySelector('#btn-toggle-grid');
    const tableBtn = container.querySelector('#btn-toggle-table');
    if (gridBtn) gridBtn.addEventListener('click', () => { fs.viewMode = 'grid'; this.renderTopicsDirectory(container); });
    if (tableBtn) tableBtn.addEventListener('click', () => { fs.viewMode = 'table'; this.renderTopicsDirectory(container); });

    // Stage Filter Chips
    container.querySelectorAll('#stage-filter-chips .filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        fs.stage = chip.getAttribute('data-stage');
        this.renderTopicsDirectory(container);
      });
    });

    // Status Filter Chips
    container.querySelectorAll('.filter-chip[data-status]').forEach(chip => {
      chip.addEventListener('click', () => {
        fs.status = chip.getAttribute('data-status');
        this.renderTopicsDirectory(container);
      });
    });
  },

              </label>
              <textarea id="import-json-textarea" rows="4" style="width: 100%; background: var(--bg-card-subtle); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 8px; color: var(--text-main); font-family: var(--font-mono); font-size: 0.75rem;" placeholder="Paste exported JSON payload here..."></textarea>

                Import & Restore Progress
              </button>
            </div>
          </div>
        </div>

        <!-- Reset Data Card -->
        <div class="card" style="padding: 24px; border: 1px solid rgba(244, 63, 94, 0.3);">
          <h2 class="card-title" style="color: var(--accent-rose); margin-bottom: 6px;">Danger Zone: Reset State</h2>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 18px;">
            Clears all evidence logs, quiz scores, project progress, and resets all topics to 'Not Started'.
          </p>
          <button class="btn btn-outline" id="btn-reset-all-data" style="color: var(--accent-rose); border-color: var(--accent-rose);">
            Reset All Learning Progress
          </button>
        </div>
      </div>
    `;

    container.innerHTML = html;

    // Export Handler
    const exportBtn = container.querySelector('#btn-export-backup');
    if (exportBtn) {
      exportBtn.addEventListener('click', async () => {
        try {
          const data = await API.exportData();
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `ai_engineer_learning_os_backup_${new Date().toISOString().split('T')[0]}.json`;
          a.click();
          URL.revokeObjectURL(url);
          App.showToast('Downloaded learning state backup.');
        } catch (err) {
          alert(`Export failed: ${err.message}`);
        }
      });
    }

    // Import Handler
    const importBtn = container.querySelector('#btn-import-backup');
    if (importBtn) {
      importBtn.addEventListener('click', async () => {
        const text = container.querySelector('#import-json-textarea').value.trim();
        if (!text) {
          alert('Please paste a valid JSON backup payload first.');
          return;
        }
        try {
          const parsed = JSON.parse(text);
          const res = await API.importData(parsed);
          App.showToast(`Restored ${res.imported_topics} topic records.`);
          await App.refreshGlobalState();
          App.navigate('dashboard');
        } catch (err) {
          alert(`Import failed: ${err.message}`);
        }
      });
    }

    // Reset Handler
    const resetBtn = container.querySelector('#btn-reset-all-data');
    if (resetBtn) {
      resetBtn.addEventListener('click', async () => {
        if (confirm('Are you sure you want to reset all learning progress? This action cannot be undone.')) {
          await API.resetData();
          App.showToast('All learning data reset to initial state.');
          await App.refreshGlobalState();
          App.navigate('dashboard');
        }
      });
    }
  },

  /* =========================================================================
     GLOBAL SEARCH (with '/' Shortcut)
     ========================================================================= */
  setupGlobalSearch() {
    const searchInput = document.getElementById('global-search-input');
    const resultsBox = document.getElementById('search-results-box');

    if (!searchInput || !resultsBox) return;

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        resultsBox.classList.remove('active');
        return;
      }

      const matches = this.state.topics.filter(t => {
        return t.title.toLowerCase().includes(q) ||
               t.importance.toLowerCase().includes(q) ||
               (t.key_concepts || []).some(k => k.toLowerCase().includes(q));
      }).slice(0, 6);

      if (matches.length === 0) {
        resultsBox.innerHTML = `<div style="padding: 16px; color: var(--text-dim); font-size: 0.85rem;">No topics matching "${q}"</div>`;
      } else {
        resultsBox.innerHTML = matches.map(m => `
          <div class="search-item" onclick="App.openTopicLesson('${m.id}'); document.getElementById('search-results-box').classList.remove('active');">
            <div style="font-weight: 700; font-size: 0.88rem; color: #fff;">${m.title}</div>
            <div style="font-size: 0.72rem; color: var(--text-muted); margin-top: 2px;">Stage ${m.stage_id} - ${m.difficulty}</div>
          </div>
        `).join('');
      }

      resultsBox.classList.add('active');
    });

    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !resultsBox.contains(e.target)) {
        resultsBox.classList.remove('active');
      }
    });
  },

  setupShortcuts() {
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        const searchInput = document.getElementById('global-search-input');
        if (searchInput) searchInput.focus();
      }
      if (e.key === 'Escape') {
        this.closeModal();
        const resultsBox = document.getElementById('search-results-box');
        if (resultsBox) resultsBox.classList.remove('active');
      }
    });
  },

  setupTheme() {
    const btn = document.getElementById('theme-toggle-btn');
    if (btn) {
      btn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
        const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', nextTheme);
        App.showToast(`Switched to ${nextTheme} theme.`);
      });
    }
  },

  setupNavigation() {
    document.querySelectorAll('.header-nav .nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const view = btn.getAttribute('data-view');
        if (view) this.navigate(view);
      });
    });
  },

  showToast(message) {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = `<span style="color: var(--accent-cyan);">✦</span> <span>${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 200);
    }, 3200);
  }
};

// Initialize application on DOM ready
document.addEventListener('DOMContentLoaded', () => {
  App.init();
});


</script>
</body>
</html>
